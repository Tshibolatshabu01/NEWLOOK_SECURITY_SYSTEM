<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWLOOK — Company Users</title><link rel="stylesheet" href="company-users.css">    <link rel="stylesheet" href="SaaS/actionSystem.css">
</head><body><main><header><div><span>NEWLOOK SECURITY SaaS</span><h1>Team access</h1><p>Manage authorized management accounts for your company.</p></div><div style="display:flex;gap:10px;align-items:center"><a href="admin.html">← Back to dashboard</a><button id="logout" type="button" class="action-btn action-btn-secondary">Sign out</button></div></header><section class="card"><div class="head"><div><h2>Company users</h2><small>Company Admins can manage Operations Managers and Supervisors.</small></div><button id="addUser" class="action-btn action-btn-secondary">+ Add user</button></div><div class="table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section><div id="modal" class="modal hidden"><div class="box"><button class="close action-btn action-btn-secondary" id="close">×</button><h2>Add management user</h2><p>Create an account for this company.</p><form id="form"><label>Full name<input name="fullName" required maxlength="100"></label><label>Email<input name="email" type="email" required></label><label>Temporary password<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option value="operations_manager">Operations Manager</option><option value="supervisor">Supervisor</option></select></label><button type="submit" class="action-btn action-btn-secondary">Create account</button><div id="message"></div></form></div></div><script type="module" src="company-users.js"></script></main>    <script src="SaaS/actionManager.js"></script>
</body></html>
